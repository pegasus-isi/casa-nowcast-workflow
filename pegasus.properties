# Catalogs (sites, transformations, replicas) are embedded in workflow.yml
# by workflow_generator.py — no external catalog files are needed.

# This is the name of the application for analytics
pegasus.metrics.app=CASA-NOWCAST

# NOTE: do not set pegasus.transfer.worker.package.strict=false here. The
# container image (Ubuntu 18.04) has an older glibc than typical submit
# hosts; strict=false skips the worker-package sanity check inside the
# container, so the submit host's pegasus-kickstart runs there and dies with
# "GLIBC_2.3x not found". With the default (strict=true) pegasus-lite
# rejects the mismatched package and auto-downloads one that matches the
# container's platform.

# Disables integrity checking
#pegasus.integrity.checking=none
